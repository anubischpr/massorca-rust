name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

# Two crate groups: `core` (everything except the desktop UI) and `ui`
# (massorca-ui and massorca-desktop, which build GPUI). A pull request runs
# only the group it touches; workspace-wide files run both. Pushes to main
# run both. To add a job, give it `needs: changes` and an `if:` on the
# group it belongs to. The desktop depends on every core crate (client,
# protocol, server and what it runs), so a core-only change also runs the
# desktop's real-service integration tests (`desktop-integration`), without
# the ui unit suite. `release` is core, ui or scripts/ together: it gates the
# Linux programs and the desktop bundles, which need both halves.
# `check workspace` is not filtered: every pull request compiles every crate and
# target on both systems, so a change to a shared crate cannot break one the
# filter skipped. `guards` is not filtered either: it runs the tests that scan
# every crate (one spawn path, the test-hooks gate), so a change to any crate,
# the desktop included, is held to them. Add any new workspace-wide scan there.
jobs:
  guards:
    name: workspace guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: guards
      - run: cargo test --locked -p massorca-process --test one_spawn_path
      - run: cargo test --locked -p massorca-core-agents --test test_hooks_gate

  check:
    name: check workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libglib2.0-dev libasound2-dev libva-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - run: cargo check --workspace --all-targets --locked
      # The phone's build of the client (decision 0080): the network path only, without the local service's crates.
      - name: Check the client without the local service
        shell: bash
        run: |
          cargo check -p massorca-client --no-default-features --locked
          if cargo tree -p massorca-client --no-default-features -e normal --target aarch64-linux-android             | grep -E 'interprocess|massorca-process|massorca-profile'; then
            echo "the client without 'local' still depends on the local service's crates" >&2
            exit 1
          fi

  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.groups.outputs.core }}
      ui: ${{ steps.groups.outputs.ui }}
      desktop_deps: ${{ steps.groups.outputs.desktop_deps }}
      release: ${{ steps.groups.outputs.release }}
      mobile: ${{ steps.groups.outputs.mobile }}
      emulator: ${{ steps.groups.outputs.emulator }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: groups
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; echo "mobile=true" >> "$GITHUB_OUTPUT"; echo "emulator=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$files"
          all=false; core=false; ui=false; deps=false; scripts=false; mobile=false; emulator=false
          while IFS= read -r f; do
            case "$f" in
              Cargo.toml|Cargo.lock|rust-toolchain.toml|rustfmt.toml|.github/workflows/*) all=true ;;
              mobile/*) mobile=true ;;
              scripts/*) scripts=true ;;
              crates/ui/*|crates/desktop/*) ui=true ;;
              crates/protocol/*|crates/client/*|crates/server/*|crates/core-*/*|crates/profile/*|crates/cli/*) core=true; deps=true ;;
              crates/*) core=true ;;
            esac
            # The emulator flow (decision 0080) runs only for these paths, because it is slow.
            case "$f" in
              crates/client*/*|crates/protocol/*|mobile/*|.github/workflows/*) emulator=true ;;
            esac
          done <<< "$files"
          if [ "$all" = true ]; then core=true; ui=true; mobile=true; fi
          release=false
          if [ "$core" = true ] || [ "$ui" = true ] || [ "$scripts" = true ]; then release=true; fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "desktop_deps=$deps" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "emulator=$emulator" >> "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo clippy --workspace --exclude massorca-ui --exclude massorca-desktop --all-targets --locked -- -D warnings
      # Built before any test starts a service: a test that builds it compiles dependencies while services wait (decision 0062).
      - run: cargo build --locked -p massorca-cli --example massorca-fake-vendor
      - run: cargo test --workspace --exclude massorca-ui --exclude massorca-desktop --locked ${{ matrix.os == 'windows-latest' && '--no-fail-fast' || '' }}

  core-git-baseline:
    name: core-git on Git 2.25.5
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bump the key when the build flags change: the cache holds the built prefix.
      - name: Restore Git 2.25.5
        id: git-2-25
        uses: actions/cache@v6
        with:
          path: ~/opt/git-2.25.5
          key: git-2.25.5-gnu11-${{ runner.os }}-${{ runner.arch }}
      - name: Build Git 2.25.5 from the kernel.org tarball
        if: steps.git-2-25.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o git.tar.xz \
            https://www.kernel.org/pub/software/scm/git/git-2.25.5.tar.xz
          echo "164dec6d31843a436c0db2acb79ce49a56f703f587e7c127cf421604d5570bba  git.tar.xz" | sha256sum -c -
          mkdir git-src
          tar -xJf git.tar.xz -C git-src --strip-components=1
          # Newer compilers default to C23, where `thread_local` is a keyword that Git 2.25's
          # index-pack.c uses as a struct name; gnu11 keeps the old meaning.
          make -C git-src prefix="$HOME/opt/git-2.25.5" NO_GETTEXT=1 NO_TCLTK=1 \
            NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 NO_PERL=1 NO_PYTHON=1 \
            CFLAGS="-g -O2 -Wall -std=gnu11" -j"$(nproc)" install
      - name: Put Git 2.25.5 first on PATH for the tests
        run: |
          echo "$HOME/opt/git-2.25.5/bin" >> "$GITHUB_PATH"
          echo "MASSORCA_GIT=$HOME/opt/git-2.25.5/bin/git" >> "$GITHUB_ENV"
      - name: Check the git version
        run: test "$(git --version)" = "git version 2.25.5"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-git-baseline
      - run: cargo test -p massorca-core-git --locked
      - run: cargo test -p massorca-core-workspace --locked

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libglib2.0-dev libasound2-dev libva-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      # Clippy runs on Linux only: on Windows it would compile GPUI a second
      # time (check artefacts are not reused by the test build), at double
      # minute cost. The UI crates have almost no Windows-only code.
      - if: runner.os == 'Linux'
        run: cargo clippy -p massorca-ui -p massorca-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p massorca-ui -p massorca-desktop --locked

  # A core-only change still reaches the desktop through the client and the
  # service, so the desktop's real-service tests run against it. Only the
  # integration targets run (`--test '*'`); the `ui` cache key is shared so
  # GPUI comes from the cache instead of a fresh build. When `ui` runs, it
  # already includes these tests.
  desktop-integration:
    needs: changes
    if: needs.changes.outputs.desktop_deps == 'true' && needs.changes.outputs.ui != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev             libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libglib2.0-dev libasound2-dev libva-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
          save-if: false
      # `--test '*'` builds no examples, and the bridge tests run the desktop's fake agent example.
      - run: cargo build -p massorca-desktop --examples --locked
      - run: cargo test -p massorca-desktop --test '*' --locked

  # The phone's binding (decision 0080, task A3): it must keep cross-compiling for both Android ABIs, with the NDK the
  # runner image ships. Build only; nothing is published.
  android-client:
    name: Android client (cross-compile)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Use the runner's Android NDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-client
      - name: Build the binding for arm64-v8a and x86_64
        run: cargo ndk -t arm64-v8a -t x86_64 build --locked -p massorca-client-ffi

  # The generated Kotlin bindings on the JVM (decision 0080, task A6): pairs and connects through the Kotlin API against
  # a real server on the runner, and runs the Keystore module's classes under Robolectric. No emulator, no React Native.
  android-kotlin:
    name: Android Kotlin bindings (JVM)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: android-kotlin
      # Pinned to the uniffi version in Cargo.lock.
      - run: cargo install --locked uniffi --version 0.31.2 --features cli
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: 8.14.3
      - name: Generate the Kotlin bindings, start a server and run the JVM tests
        run: scripts/ci/kotlin-bindings-test.sh

  # The phone's debug APK (decision 0080, task A7): the Rust library for both ABIs, the generated glue and the Keystore
  # module. Builds only; the APK is an artifact. Fails when the committed TypeScript bindings are not what the Rust
  # crate generates now (mobile/README.md). No emulator.
  android-apk:
    name: Android debug APK
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Use the runner's Android NDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
      - run: npm ci
      # Caches Gradle's downloads (wrapper, plugins, dependencies), keyed on the build files and the wrapper.
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build the Rust library and generate the glue
        run: npx ubrn build android --config ubrn.config.yaml --and-generate
      - name: Check the committed TypeScript is what the crate generates
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- src)" || {
            git status --short -- src
            echo "the generated TypeScript differs from what is committed; regenerate it (mobile/README.md)" >&2
            exit 1
          }
      - name: Build the debug APK
        working-directory: mobile/android
        run: ../../scripts/ci/gradle-with-retry.sh assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: massorca-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # The emulator flow (task A11) installs this one: its JavaScript is bundled into the APK, so the app needs no
      # Metro server and no development support. Signed with the committed debug key (android/app/build.gradle).
      - name: Build the release APK for the emulator flow
        working-directory: mobile/android
        run: ../../scripts/ci/gradle-with-retry.sh assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: massorca-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # The phone app on an Android emulator (decision 0080, task A11): the release APK from `android-apk` (JavaScript bundled,
  # no Metro) runs on an x86_64 emulator, the massorca service runs on the runner, and a Maestro flow pairs the app with
  # it at 10.0.2.2, the emulator's alias for the runner's loopback. Slow (KVM, emulator boot), so it runs only for the
  # client, the protocol, the phone app and this workflow. The pairing offer is masked and redacted from every kept log.
  android-emulator:
    name: Android emulator flow
    needs: [changes, android-apk]
    if: needs.changes.outputs.emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Let the emulator use KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the pinned Maestro CLI
        run: bash scripts/ci/install-maestro.sh
      - uses: actions/download-artifact@v8
        with:
          name: massorca-release-apk
          path: ${{ runner.temp }}/apk
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-emulator
      - name: Build the massorca CLI
        run: cargo build --locked -p massorca-cli --bin massorca
      - name: Start the service on the runner with the flow's project
        run: bash scripts/ci/start-massorca-service.sh
      - name: Run the Maestro flow on an x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          cores: 4
          disable-spellchecker: true
          script: bash scripts/ci/run-emulator-flow.sh
      - name: Stop the service
        if: always()
        run: |
          if [ -n "${MASSORCA_BIN:-}" ]; then "$MASSORCA_BIN" --no-autostart service stop || true; fi
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-logs
          path: |
            ${{ runner.temp }}/massorca-service.log
            ${{ runner.temp }}/logcat-full.txt
            ${{ runner.temp }}/logcat-crash.txt
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  # Linux programs for the desktop bundle (decisions 0075, 0076): build and check only, no secrets, nothing published.
  # zig pins the glibc version the programs link against, so the floor does not depend on the runner image.
  linux-programs:
    name: Linux programs (glibc floor)
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GLIBC_FLOOR: "2.31"
    outputs:
      sha256_x86_64: ${{ steps.stage.outputs.sha256_x86_64 }}
      sha256_aarch64: ${{ steps.stage.outputs.sha256_aarch64 }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Install zig 0.17.1 and cargo-zigbuild 0.24.1
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.17.1
          "$RUNNER_TEMP/zig/bin/python" -m ziglang version
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.24.1
      - name: Test the glibc floor check
        run: scripts/test-check-glibc-floor.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-programs
      - name: Build massorca for x86_64 and aarch64
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked -p massorca-cli --bin massorca \
              --target "$arch-unknown-linux-gnu.$GLIBC_FLOOR"
          done
      - name: Stage the programs as the desktop bundle carries them
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist/resources
          install -m 0755 target/x86_64-unknown-linux-gnu/release/massorca dist/resources/massorca-linux-x86_64
          install -m 0755 target/aarch64-unknown-linux-gnu/release/massorca dist/resources/massorca-linux-aarch64
          sha256sum dist/resources/*
          echo "sha256_x86_64=$(sha256sum dist/resources/massorca-linux-x86_64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256_aarch64=$(sha256sum dist/resources/massorca-linux-aarch64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check the glibc floor and the ELF machine of each program
        run: |
          set -euo pipefail
          scripts/check-glibc-floor.sh "$GLIBC_FLOOR" dist/resources/massorca-linux-x86_64 dist/resources/massorca-linux-aarch64
          check_elf() { # check_elf <program> <Machine text readelf prints>
            local header
            header="$(readelf -h "$1")"
            grep -q 'Class: *ELF64' <<< "$header"
            grep -q "Data: *2's complement, little endian" <<< "$header"
            grep -q "Machine: *$2" <<< "$header"
          }
          check_elf dist/resources/massorca-linux-x86_64 'Advanced Micro Devices X86-64'
          check_elf dist/resources/massorca-linux-aarch64 'AArch64'
      - name: Run the x86_64 program
        run: dist/resources/massorca-linux-x86_64 --version
      - uses: actions/upload-artifact@v7
        with:
          name: massorca-linux-resources
          path: dist/resources
          if-no-files-found: error

  # Desktop bundle per OS: the app plus resources/massorca-linux-<arch> next to its executable (decisions 0075, 0077).
  # Build and check only: no release, no signing, no secrets.
  desktop-bundle:
    name: Desktop bundle (${{ matrix.os }})
    needs: [changes, linux-programs]
    if: needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GLIBC_FLOOR: "2.31"
      SHA256_X86_64: ${{ needs.linux-programs.outputs.sha256_x86_64 }}
      SHA256_AARCH64: ${{ needs.linux-programs.outputs.sha256_aarch64 }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libglib2.0-dev libasound2-dev libva-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-bundle
      - name: Build the desktop app in release mode
        run: cargo build --release --locked -p massorca-desktop --bin massorca-desktop
      - name: Assemble the bundle
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p bundle
          cp "target/release/massorca-desktop$ext" "bundle/massorca-desktop$ext"
      - name: Put the Linux programs in resources/
        uses: actions/download-artifact@v8
        with:
          name: massorca-linux-resources
          path: bundle/resources
      - name: Check the layout, the checksums and the glibc floor
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          test -f "bundle/massorca-desktop$ext"
          test "$(ls -1 bundle/resources | sort)" = "$(printf 'massorca-linux-aarch64\nmassorca-linux-x86_64')"
          test "$(sha256sum bundle/resources/massorca-linux-x86_64 | cut -d' ' -f1)" = "$SHA256_X86_64"
          test "$(sha256sum bundle/resources/massorca-linux-aarch64 | cut -d' ' -f1)" = "$SHA256_AARCH64"
          # The floor check reads ELF headers with readelf; the Linux bundle job runs it on the same bytes.
          if [ "$RUNNER_OS" = "Linux" ]; then
            scripts/check-glibc-floor.sh "$GLIBC_FLOOR" bundle/resources/massorca-linux-x86_64 bundle/resources/massorca-linux-aarch64
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: massorca-desktop-bundle-${{ runner.os }}
          path: bundle
          if-no-files-found: error

  # The phone app (decision 0080, task A7): TypeScript, lint, the generated tokens and Jest, with no native library.
  mobile:
    name: mobile (typecheck, lint, test)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run tokens:check
      - run: node scripts/generate-terminal-asset.ts --check
      - run: npm test
