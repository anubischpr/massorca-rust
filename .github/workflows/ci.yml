name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

# Two crate groups: `core` (everything except the desktop UI) and `ui`
# (massorca-ui and massorca-desktop, which build GPUI). A pull request runs
# only the group it touches; workspace-wide files run both. Pushes to main
# run both. To add a job, give it `needs: changes` and an `if:` on the
# group it belongs to. The desktop depends on every core crate (client,
# protocol, server and what it runs), so a core-only change also runs the
# desktop's real-service integration tests (`desktop-integration`), without
# the ui unit suite. `release` is core, ui or scripts/ together: it gates the
# Linux programs and the desktop bundles, which need both halves.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.groups.outputs.core }}
      ui: ${{ steps.groups.outputs.ui }}
      desktop_deps: ${{ steps.groups.outputs.desktop_deps }}
      release: ${{ steps.groups.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: groups
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$files"
          all=false; core=false; ui=false; deps=false; scripts=false
          while IFS= read -r f; do
            case "$f" in
              Cargo.toml|Cargo.lock|rust-toolchain.toml|rustfmt.toml|.github/workflows/*) all=true ;;
              scripts/*) scripts=true ;;
              crates/ui/*|crates/desktop/*) ui=true ;;
              crates/protocol/*|crates/client/*|crates/server/*|crates/core-*/*|crates/profile/*|crates/cli/*) core=true; deps=true ;;
              crates/*) core=true ;;
            esac
          done <<< "$files"
          if [ "$all" = true ]; then core=true; ui=true; fi
          release=false
          if [ "$core" = true ] || [ "$ui" = true ] || [ "$scripts" = true ]; then release=true; fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "desktop_deps=$deps" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo clippy --workspace --exclude massorca-ui --exclude massorca-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude massorca-ui --exclude massorca-desktop --locked

  core-git-baseline:
    name: core-git on Git 2.25.5
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bump the key when the build flags change: the cache holds the built prefix.
      - name: Restore Git 2.25.5
        id: git-2-25
        uses: actions/cache@v6
        with:
          path: ~/opt/git-2.25.5
          key: git-2.25.5-gnu11-${{ runner.os }}-${{ runner.arch }}
      - name: Build Git 2.25.5 from the kernel.org tarball
        if: steps.git-2-25.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o git.tar.xz \
            https://www.kernel.org/pub/software/scm/git/git-2.25.5.tar.xz
          echo "164dec6d31843a436c0db2acb79ce49a56f703f587e7c127cf421604d5570bba  git.tar.xz" | sha256sum -c -
          mkdir git-src
          tar -xJf git.tar.xz -C git-src --strip-components=1
          # Newer compilers default to C23, where `thread_local` is a keyword that Git 2.25's
          # index-pack.c uses as a struct name; gnu11 keeps the old meaning.
          make -C git-src prefix="$HOME/opt/git-2.25.5" NO_GETTEXT=1 NO_TCLTK=1 \
            NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 NO_PERL=1 NO_PYTHON=1 \
            CFLAGS="-g -O2 -Wall -std=gnu11" -j"$(nproc)" install
      - name: Put Git 2.25.5 first on PATH for the tests
        run: |
          echo "$HOME/opt/git-2.25.5/bin" >> "$GITHUB_PATH"
          echo "MASSORCA_GIT=$HOME/opt/git-2.25.5/bin/git" >> "$GITHUB_ENV"
      - name: Check the git version
        run: test "$(git --version)" = "git version 2.25.5"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-git-baseline
      - run: cargo test -p massorca-core-git --locked
      - run: cargo test -p massorca-core-workspace --locked

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libglib2.0-dev libasound2-dev libva-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      # Clippy runs on Linux only: on Windows it would compile GPUI a second
      # time (check artefacts are not reused by the test build), at double
      # minute cost. The UI crates have almost no Windows-only code.
      - if: runner.os == 'Linux'
        run: cargo clippy -p massorca-ui -p massorca-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p massorca-ui -p massorca-desktop --locked

  # A core-only change still reaches the desktop through the client and the
  # service, so the desktop's real-service tests run against it. Only the
  # integration targets run (`--test '*'`); the `ui` cache key is shared so
  # GPUI comes from the cache instead of a fresh build. When `ui` runs, it
  # already includes these tests.
  desktop-integration:
    needs: changes
    if: needs.changes.outputs.desktop_deps == 'true' && needs.changes.outputs.ui != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev             libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libglib2.0-dev libasound2-dev libva-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
          save-if: false
      - run: cargo test -p massorca-desktop --test '*' --locked

  # Linux programs for the desktop bundle (decisions 0075, 0076): build and check only, no secrets, nothing published.
  # zig pins the glibc version the programs link against, so the floor does not depend on the runner image.
  linux-programs:
    name: Linux programs (glibc floor)
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GLIBC_FLOOR: "2.31"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Install zig 0.17.1 and cargo-zigbuild 0.24.1
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.17.1
          "$RUNNER_TEMP/zig/bin/python" -m ziglang version
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.24.1
      - name: Test the glibc floor check
        run: scripts/test-check-glibc-floor.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-programs
      - name: Build massorca for x86_64 and aarch64
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked -p massorca-cli --bin massorca \
              --target "$arch-unknown-linux-gnu.$GLIBC_FLOOR"
          done
      - name: Stage the programs as the desktop bundle carries them
        run: |
          set -euo pipefail
          mkdir -p dist/resources
          install -m 0755 target/x86_64-unknown-linux-gnu/release/massorca dist/resources/massorca-linux-x86_64
          install -m 0755 target/aarch64-unknown-linux-gnu/release/massorca dist/resources/massorca-linux-aarch64
          sha256sum dist/resources/*
      - name: Check the glibc floor and the ELF machine of each program
        run: |
          set -euo pipefail
          scripts/check-glibc-floor.sh "$GLIBC_FLOOR" dist/resources/massorca-linux-x86_64 dist/resources/massorca-linux-aarch64
          check_elf() { # check_elf <program> <Machine text readelf prints>
            local header
            header="$(readelf -h "$1")"
            grep -q 'Class: *ELF64' <<< "$header"
            grep -q "Data: *2's complement, little endian" <<< "$header"
            grep -q "Machine: *$2" <<< "$header"
          }
          check_elf dist/resources/massorca-linux-x86_64 'Advanced Micro Devices X86-64'
          check_elf dist/resources/massorca-linux-aarch64 'AArch64'
      - name: Run the x86_64 program
        run: dist/resources/massorca-linux-x86_64 --version
      - uses: actions/upload-artifact@v7
        with:
          name: massorca-linux-resources
          path: dist/resources
          if-no-files-found: error
