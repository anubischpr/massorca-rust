[package]
name = "massorca-core-terminal"
description = "Shells in pseudo-terminals that outlive their clients: PTYs, process trees, screen and scrollback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reads each terminal's processes for host memory (decision 0081).
massorca-host-stats.workspace = true
portable-pty.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
uuid.workspace = true
vt100.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# A job object per terminal ends its whole process tree (decision 0031).
[target.'cfg(windows)'.dependencies]
win32job.workspace = true
# The machine and user PATH a terminal starts with, read from the registry (decision 0032).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
massorca-process = { workspace = true, features = ["test-support"] }
alacritty_terminal.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
