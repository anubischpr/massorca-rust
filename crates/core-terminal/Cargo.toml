[package]
name = "massorca-core-terminal"
description = "Shells in pseudo-terminals that outlive their clients: PTYs, process trees, screen and scrollback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
portable-pty.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
uuid.workspace = true
vt100.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# A job object per terminal ends its whole process tree (decision 0031).
[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
massorca-process.workspace = true
alacritty_terminal.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
