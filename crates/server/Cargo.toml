[package]
name = "massorca-server"
description = "The MassOrca service: listener, connections, the method, capability, settings and event registries, and the core features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
directories.workspace = true
dunce.workspace = true
interprocess.workspace = true
jiff.workspace = true
massorca-core-agents.workspace = true
massorca-core-extensions.workspace = true
massorca-core-git.workspace = true
massorca-core-tools.workspace = true
massorca-core-remote.workspace = true
massorca-core-schedule.workspace = true
massorca-core-watch.workspace = true
massorca-core-store.workspace = true
massorca-core-terminal.workspace = true
massorca-core-vault.workspace = true
massorca-core-workspace.workspace = true
massorca-host-stats.workspace = true
massorca-net.workspace = true
massorca-profile.workspace = true
massorca-process.workspace = true
massorca-protocol.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
zeroize.workspace = true

# A vendor installer runs in its own process group on Unix, so a timeout ends everything it started (decision 0062).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# A vendor installer runs in a kill-on-close job, so a timeout ends everything it started (decision 0062).
[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
massorca-process = { workspace = true, features = ["test-support"] }
massorca-core-store = { workspace = true, features = ["test-support"] }
massorca-client.workspace = true
massorca-ext-package.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
