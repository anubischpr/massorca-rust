[package]
name = "massorca-core-agents"
description = "Coding agents in workspaces: kind declarations and their loader, program resolution, launch plans and sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
massorca-process.workspace = true
massorca-core-store.workspace = true
massorca-core-terminal.workspace = true
massorca-core-vault.workspace = true
massorca-core-workspace.workspace = true
massorca-protocol.workspace = true
serde.workspace = true
regex = "1"
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
massorca-profile.workspace = true
win32job.workspace = true

[features]
# Test-only crash points (`MASSORCA_TEST_CRASH_AT`). Only test builds enable it, through the CLI's dev-dependencies; a
# test fails when a normal or build dependency enables it.
test-hooks = []

[dev-dependencies]
massorca-core-git.workspace = true
tempfile.workspace = true

[lints]
workspace = true
