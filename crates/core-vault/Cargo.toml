[package]
name = "massorca-core-vault"
description = "Secret values, the vault cipher and the OS-protected master key (decision 0071)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
massorca-core-store.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
massorca-profile.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
oo7.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
massorca-process.workspace = true
tempfile.workspace = true

[lints]
workspace = true
