[package]
name = "massorca-desktop"
description = "MassOrca desktop app on GPUI: the shell, view models and data sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
jiff.workspace = true
massorca-client.workspace = true
massorca-core-remote.workspace = true
massorca-net.workspace = true
massorca-profile.workspace = true
massorca-protocol.workspace = true
massorca-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
embed-resource.workspace = true

# The fake agent of the CLI crate's tests, built here too so the chat bridge test can start it. The CLI crate's own
# source is compiled, not copied.
[[example]]
name = "massorca-fake-agent"
path = "../cli/src/bin/fake_agent.rs"

[dev-dependencies]
# The service the chat bridge test starts carries the test-only version probe allow list; a release build does not.
massorca-core-agents = { workspace = true, features = ["test-hooks"] }
massorca-process.workspace = true
massorca-server.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
