[package]
name = "massorca-core-git"
description = "Runs the user's git binary and answers repository, worktree and branch queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
massorca-process.workspace = true
dunce.workspace = true
massorca-core-remote.workspace = true
massorca-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true

# A job object kills every process git starts; the suspended spawn into it lives in core-remote.
[target.'cfg(windows)'.dependencies]
win32job.workspace = true
# The final path of an open file, to check where a read really lands (decision 0103).
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

# Opening a file without waiting for a writer, so a FIFO cannot block a read (decision 0103).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
