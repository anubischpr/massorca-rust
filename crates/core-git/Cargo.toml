[package]
name = "massorca-core-git"
description = "Runs the user's git binary and answers repository, worktree and branch queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce.workspace = true
thiserror.workspace = true

# A job object kills every process git starts, through a safe API.
[target.'cfg(windows)'.dependencies]
win32job.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
