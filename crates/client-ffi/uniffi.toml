# Kotlin only (the JVM test job, decision 0080 task A6; the app's TypeScript is generated by ubrn from its own config).
# A Kotlin exception already has `message` and an AutoCloseable object already has `close()`, and the generated class
# cannot declare a second one with the same name.
[bindings.kotlin.rename]
"AgentWatch.close" = "stop"
"GitWatch.close" = "stop"
"TerminalView.close" = "stop"
"StorageError.Failed.message" = "reason"
"FfiError.Unreachable.message" = "reason"
"FfiError.IdentityMismatch.message" = "reason"
"FfiError.NotPaired.message" = "reason"
"FfiError.ProtocolMismatch.message" = "reason"
"FfiError.InvalidOffer.message" = "reason"
"FfiError.HostExists.message" = "reason"
"FfiError.HostNotFound.message" = "reason"
"FfiError.InvalidHostName.message" = "reason"
"FfiError.Remote.message" = "reason"
"FfiError.Storage.message" = "reason"
"FfiError.Internal.message" = "reason"
