[package]
name = "massorca-cli"
description = "The massorca command: runs and controls the service of a profile, reads and changes its settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "massorca_cli"
path = "src/lib.rs"

[[bin]]
name = "massorca"
path = "src/main.rs"

# The fake agent for the CLI's own tests (ADR 0057); installers ship `massorca` only.
[[bin]]
name = "massorca-fake-agent"
path = "src/bin/fake_agent.rs"
test = false
doc = false

[dependencies]
massorca-process.workspace = true
clap.workspace = true
crossterm.workspace = true
massorca-client.workspace = true
massorca-core-remote.workspace = true
massorca-core-terminal.workspace = true
massorca-net.workspace = true
massorca-profile.workspace = true
massorca-protocol.workspace = true
massorca-server.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
vt100.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
