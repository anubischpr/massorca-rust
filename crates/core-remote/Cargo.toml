[package]
name = "massorca-core-remote"
description = "Remote hosts of MassOrca: Tailscale status, SSH bootstrap through the system ssh, the systemd user unit (decisions 0043 to 0045)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
massorca-process.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# A suspended spawn into a kill-on-close job, shared by core-git and the service (decision 0062).
[target.'cfg(windows)'.dependencies]
win32job.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
massorca-process = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
