# Spike for decision 0060 (QuickJS guest). Own workspace; not a member of spikes/ext-runtime.
[workspace]
resolver = "3"

[package]
name = "js-quickjs"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rquickjs = "0.14"
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
