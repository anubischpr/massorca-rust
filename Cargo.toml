[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
massorca-protocol = { path = "crates/protocol" }
massorca-ui = { path = "crates/ui" }
massorca-profile = { path = "crates/profile" }
massorca-core-store = { path = "crates/core-store" }
massorca-core-git = { path = "crates/core-git" }
massorca-core-terminal = { path = "crates/core-terminal" }
massorca-core-workspace = { path = "crates/core-workspace" }
massorca-server = { path = "crates/server" }
massorca-client = { path = "crates/client" }
massorca-net = { path = "crates/net" }

# GPUI from one pinned Zed commit (decision 0020).
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit", "wayland", "x11"] }

anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
libc = "0.2.191"
dunce = "1.0.5"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
interprocess = { version = "2.4.9", features = ["tokio"] }
portable-pty = "0.9.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.3", features = ["v7"] }
vt100 = "0.18.1"
widestring = "1.2.1"
x509-parser = "0.18.1"
win32job = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

# test only
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev.package."*"]
debug = false
