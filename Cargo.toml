[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
massorca-protocol = { path = "crates/protocol" }
massorca-ui = { path = "crates/ui" }
massorca-profile = { path = "crates/profile" }
massorca-core-store = { path = "crates/core-store" }
massorca-core-git = { path = "crates/core-git" }
massorca-core-terminal = { path = "crates/core-terminal" }
massorca-core-watch = { path = "crates/core-watch" }
massorca-core-workspace = { path = "crates/core-workspace" }
massorca-core-agents = { path = "crates/core-agents" }
massorca-server = { path = "crates/server" }
massorca-client = { path = "crates/client" }

# GPUI from one pinned Zed commit (decision 0020).
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit", "wayland", "x11"] }

# Terminal emulator of the desktop surface: Zed's fork, at the rev its pinned GPUI commit uses.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }

anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
embed-resource = "3.0.12"
libc = "0.2.191"
notify = "9.0.0"
dunce = "1.0.5"
interprocess = { version = "2.4.9", features = ["tokio"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.3", features = ["v7"] }
vt100 = "0.18.1"
widestring = "1.2.1"
win32job = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

# test only
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev.package."*"]
debug = false
