# Screens 1, 2, 4 and 6 of the Android app (decision 0080, task A11), run by the android-emulator job in ci.yml against a
# massorca service on the runner, which the emulator reaches at 10.0.2.2. The job makes the pairing offer and starts one
# shell in the e2e-folder workspace (scripts/ci/start-massorca-service.sh). MASSORCA_PAIRING_OFFER is passed with -e and
# is never printed.
appId: dev.massorca.app
---
- launchApp:
    clearState: true
# Screen 1: the connect hint, then the pasted pairing code.
- extendedWaitUntil:
    visible: "Connect your desktop"
    timeout: 240000
- tapOn: "Paste a code"
- tapOn:
    id: "pairing-code"
- inputText: ${MASSORCA_PAIRING_OFFER}
- tapOn: "Connect"
- extendedWaitUntil:
    visible: ".*Pair with this desktop.*"
    timeout: 90000
- tapOn: "Pair"
# Screen 2: Home lists the paired host as connected. Its name is the runner's machine name (the server's name in the
# offer), so the card is matched by its state, not by the name.
- extendedWaitUntil:
    visible: ".*, Connected"
    timeout: 150000
- tapOn: ".*, Connected"
# Screen 4: the host's projects list the folder workspace the job created, which has no git.
- extendedWaitUntil:
    visible: "Projects"
    timeout: 60000
- extendedWaitUntil:
    visible: "e2e-folder, No Git"
    timeout: 60000
# The workspace opens on its Changes view. Its Terminal view opens the workspace's only live terminal at once.
- tapOn: "e2e-folder, No Git"
- tapOn:
    id: "workspace-view-terminal"
# Screen 6: the shell's prompt shows once the terminal page is ready and attached. Until then the input takes no text.
- extendedWaitUntil:
    visible: '.*\$.*'
    timeout: 120000
- tapOn:
    id: "terminal-input"
# The shell prints marker6 and the typed line reads ma''rker6, so the assertion can only match the output.
- inputText: "echo ma''rker6"
# Enter on the keyboard submits the line. The send button can sit under the keyboard, so it is not tapped.
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*marker6.*"
    timeout: 60000
