pluginManagement {
    repositories {
        // Google's mirror of Maven Central first: Central answers 429 to busy CI runners, and Gradle does not fall back
        // to the next repository on a 429.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        // Google's mirror of Maven Central first: Central answers 429 to busy CI runners, and Gradle does not fall back
        // to the next repository on a 429.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        google()
        mavenCentral()
    }
}
rootProject.name = 'bindings-test'
